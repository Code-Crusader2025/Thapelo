<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <style>
        body {
            background-color: gray;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        nav {
            width: 100%;
            background-color: rgb(255, 0, 0);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
            position: fixed;
            top: 0;
            left: 0;
            padding: 10px 0;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        nav ul li {
            margin: 0 20px;
        }

        nav ul li a {
            display: block;
            text-decoration: none;
            color: white;
            padding: 10px 16px;
            font-size: 18px;
            font-weight: bold;
        }

        nav ul li a:hover {
            background-color: black;
        }

        .slideshow-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 60px); 
            overflow: hidden;
            margin-top: 60px; 
              }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            background-size: cover;
            background-position: center; 
        }

        .active {
            opacity: 1;
        }

        footer {
            text-align: center;
            padding: 10px;
            background: #333;
            color: #fff;
            position: relative;
            bottom: 0;
            width: 100%;
        }

        @media (max-width: 768px) {
            nav ul li {
                margin: 0 10px; 
            }
            main{
                flex-direction: column;
            }
            nav ul li a {
                flex-direction: column;
                align-items: center;
                font-size: 16px; 
            }
        }

    </style>
</head>
<body>

    <nav>
        <ul>
            <li><a href="home.html">HOME</a></li>
            <li><a href="about.html">ABOUT</a></li>
            <li><a href="project.html">PROJECT</a></li>
            <li><a href="contact.html">CONTACT</a></li>
        </ul>
    </nav>

    <div class="slideshow-container">
        <div class="slide active" style="background-image: url('SL1.png');"></div>
        <div class="slide" style="background-image: url('SL2.png');"></div>
        <div class="slide" style="background-image: url('SL3.png');"></div>
        <div class="slide" style="background-image: url('SL4.png');"></div>
        <div class="slide" style="background-image: url('SL5.png');"></div>
        <div class="slide" style="background-image: url('SL6.png');"></div>
        <div class="slide" style="background-image: url('SL7.png');"></div>
      
    </div>

    <footer>
        <p>&copy; 2025 ON MY WEB PAGE. ALL RIGHTS RESERVED</p>
    </footer>

    <script>
        let currentIndex = 0;
        const slides = document.querySelectorAll('.slide');
        const totalSlides = slides.length;

        function showNextSlide() {
            slides[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % totalSlides;
            slides[currentIndex].classList.add('active');
        }

        setInterval(showNextSlide, 5000); 
    </script>

</body>
</html>
